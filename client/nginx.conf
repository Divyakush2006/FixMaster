# Serves the built single-page app and reverse-proxies /api to the API
# container ("api" on the compose network).
#
# Note on add_header: nginx does NOT merge add_header across levels - any
# add_header inside a location replaces all inherited ones. So each location
# below declares exactly the headers it needs, and /api/ declares none (the
# API sets its own security headers via helmet).

upstream fixmaster_api {
    server api:5000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # API: forwarded with the real client address. The API must run with
    # TRUST_PROXY=1 so its rate limiting sees each user's IP, not nginx's.
    location /api/ {
        proxy_pass http://fixmaster_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        client_max_body_size 200k;
        proxy_read_timeout 30s;
    }

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The SPA. index.html must not be cached, or users keep loading an old
    # bundle (whose chunks no longer exist) after a deploy.
    # CSP: the production bundle has no inline scripts, so scripts are
    # restricted to this origin; inline styles are allowed because the
    # charting library sets style attributes.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
