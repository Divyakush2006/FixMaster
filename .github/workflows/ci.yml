name: CI

on:
  push:
    branches: [main, dev, final]
  pull_request:
    branches: [main, dev, final]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No credentials in the repository (gitleaks, rules in .gitleaks.toml)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner

  backend:
    name: API tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 15 = the local dev setup, 16 = the docker-compose image.
        postgres: ['15', '16']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          # Throwaway database reachable only from this job: no password, so
          # none has to be written into the repository.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Shared rate-limit counters (several API servers acting as one).
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/fix_master_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated SQL bundles are up to date
        run: npm run db:bundle -- --check
      - name: No known vulnerabilities (production and dev dependencies)
        run: npm audit --audit-level=high
      - run: npm test

  frontend:
    name: Web app (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Production dependencies have no known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  browser:
    name: Browser tests (Chromium, software rendering)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/fix_master_test
      E2E_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Sessions, briefing, autopilot, cleaning plan and privacy screens
        # Starts the API and the built web app on spare ports against a throwaway
        # database. The sign-up and password-reset tests need a mail catcher and
        # run in the container stack (docker-compose.e2e.yml).
        run: node e2e/local-stack.js tests/01-sessions.spec.ts tests/03-campus-intelligence.spec.ts
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/test-results
          retention-days: 7

  docker:
    name: Container stack (build + smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      WEB_PORT: 8080
      CORS_ORIGIN: http://localhost:8080
    steps:
      - uses: actions/checkout@v5
      - name: The API refuses to start in production with a weak secret
        run: |
          docker build -t fix-master-api .
          if docker run --rm -e NODE_ENV=production -e JWT_SECRET=short -e CORS_ORIGIN=x -e DATABASE_URL=postgresql://x@localhost/x fix-master-api node -e "require('./src/app')"; then
            echo "API started with a weak JWT_SECRET"; exit 1
          fi
      - name: Generate throwaway secrets for this run
        # Job-wide (via GITHUB_ENV): every later compose command, including the
        # cleanup step, interpolates the compose file and needs them. Nothing
        # is written into the repository.
        run: |
          secret=$(openssl rand -hex 48)
          dbpass=$(openssl rand -hex 24)
          echo "::add-mask::$secret"
          echo "::add-mask::$dbpass"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$dbpass" >> "$GITHUB_ENV"
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'
          curl -fsS -o /dev/null http://localhost:8080/admin/audit
          curl -fsSI http://localhost:8080/ | grep -qi '^content-security-policy:'
          curl -fsSI http://localhost:8080/ | grep -qi '^x-frame-options: DENY'
          curl -fsSI http://localhost:8080/api/health | grep -qi '^strict-transport-security:'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/admin/users)" = "401"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
