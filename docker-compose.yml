# FIX_MASTER full stack: PostgreSQL + API + web (nginx serving the React app
# and proxying /api).
#
#   cp .env.example .env            # then set JWT_SECRET (and POSTGRES_PASSWORD)
#   docker compose up -d --build    # http://localhost:8080
#
# Optional demo data (shared demo passwords - never on a real deployment):
#   docker compose --profile demo run --rm seed

name: fix_master

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fix_master_db
      POSTGRES_USER: fix_master
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fix_master_local_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fix_master -d fix_master_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://fix_master:${POSTGRES_PASSWORD:-fix_master_local_only}@db:5432/fix_master_db
      # Required: the API refuses to start without a real secret in production.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 random characters)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: 1
    restart: unless-stopped

  web:
    build: ./client
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  seed:
    build: .
    profiles: ["demo"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://fix_master:${POSTGRES_PASSWORD:-fix_master_local_only}@db:5432/fix_master_db
    command: ["node", "scripts/seed.js"]

volumes:
  pgdata:
