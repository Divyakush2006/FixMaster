# FIX_MASTER full stack: PostgreSQL + API + web (nginx serving the React app
# and proxying /api).
#
#   cp .env.example .env            # then set JWT_SECRET (and POSTGRES_PASSWORD)
#   docker compose up -d --build    # http://localhost:8080
#
# First start of a real deployment: create the administrator (random password, written to ./credentials):
#   docker compose --profile setup run --rm provision
#
# Optional demo data (shared demo passwords - never on a real deployment):
#   docker compose --profile demo run --rm seed

name: fix_master

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fix_master_db
      POSTGRES_USER: fix_master
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (a random value)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fix_master -d fix_master_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://fix_master:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (a random value)}@db:5432/fix_master_db
      # Required: the API refuses to start without a real secret in production.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 random characters)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: 1
      UPLOAD_DIR: /data/uploads
      # Optional: enables "Forgot password?" by email (see .env.example).
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_URL: ${APP_URL:-}
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

  web:
    build: ./client
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  # Scheduled logical backups (pg_dump) of the database, kept on the `backups`
  # volume. Runs one backup at start-up, then every BACKUP_INTERVAL_HOURS.
  # Copy that volume off this host (object storage, another machine): a backup
  # that lives only next to the database does not survive losing the host.
  # Restore: scripts/restore.sh (see docs/OPERATIONS.md).
  backup:
    image: postgres:16-alpine
    depends_on:
      api:
        condition: service_healthy # the API applies migrations on start
    environment:
      DATABASE_URL: postgresql://fix_master:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (a random value)}@db:5432/fix_master_db
      BACKUP_DIR: /backups
      UPLOAD_DIR: /data/uploads
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - backups:/backups
      - uploads:/data/uploads:ro
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    # A failed backup is logged and retried next cycle; the healthcheck below
    # turns "no fresh backup" into an unhealthy container that monitoring sees.
    command:
      - |
        while true; do
          /bin/sh /usr/local/bin/backup.sh || echo "backup failed, will retry next cycle" >&2
          sleep $$((BACKUP_INTERVAL_HOURS * 3600))
        done
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name 'fixmaster-*.dump' -mmin -$$((BACKUP_INTERVAL_HOURS * 60 + 60)) | grep -q ."]
      interval: 10m
      timeout: 10s
      retries: 1
      start_period: 5m
    restart: unless-stopped

  # One-shot: the first administrator, with a random password that must be changed at first sign-in.
  # The credentials file lands in ./credentials/ (git-ignored); sign in at /admin, then create the other
  # accounts under Users and access. For a larger sample roster, see docs/OPERATIONS.md ("Accounts").
  provision:
    build: .
    profiles: ["setup"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://fix_master:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (a random value)}@db:5432/fix_master_db
    volumes:
      - ./credentials:/out
    command: ["node", "scripts/provision-accounts.js", "--yes", "--admin-only", "--out", "/out/admin-credentials.txt", "--web-url", "${APP_URL:-http://localhost:8080}"]

  seed:
    build: .
    profiles: ["demo"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://fix_master:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (a random value)}@db:5432/fix_master_db
    command: ["node", "scripts/seed.js"]

volumes:
  pgdata:
  backups:
  uploads:
